name: Daily Contribution

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger from GitHub UI

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update activity log
        run: |
          echo "Commit on $(date)" >> activity.txt

      - name: Commit changes
        run: |
          git config --global user.name "mmpbrother94"
          git config --global user.email "manoharmanish03359@gmail.com"
          git add activity.txt
          git commit -m "Daily contribution: $(date)" || echo "No changes to commit"

      - name: Push changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git push https://mmpbrother94:${GH_PAT}@github.com/mmpbrother94/commit-graph.git
