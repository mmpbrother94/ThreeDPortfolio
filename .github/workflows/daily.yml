name: Daily Contribution
on:
  schedule:
      - cron: '0 0 * * *'
        workflow_dispatch:
        jobs:
          commit:
              runs-on: ubuntu-latest
                  steps:
                        - name: Checkout repository
                                uses: actions/checkout@v3
                                        with:
                                                  persist-credentials: false
                                                        - name: Update activity log
                                                                run: |
                                                                          echo "Commit on $(date)" >> activity.txt
                                                                                - name: Set up Git
                                                                                        run: |
                                                                                                  git config --global user.name "mmpbrother94"
                                                                                                            git config --global user.email "manoharmanish03359@gmail.com"
                                                                                                                  - name: Push changes
                                                                                                                          env:
                                                                                                                                    PAT: ${{ secrets.GH_PAT }}
                                                                                                                                            run: |
                                                                                                                                                      git remote set-url origin https://x-access-token:${PAT}@github.com/${{ github.repository }}
                                                                                                                                                                git add activity.txt
                                                                                                                                                                          git commit -m "Daily contribution: $(date -u)" || echo "Nothing to commit"
      - name: Set up Git
        run: |
          git config --global user.name "mmpbrother94"
          git config --global user.email "manoharmanish03359@gmail.comm"

      - name: Push changes
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          git remote set-url origin https://x-access-token:${PAT}@github.com/${{ github.repository }}
          git add activity.txt
          git commit -m "Daily contribution: $(date -u)" || echo "Nothing to commit"
          git push origin HEAD:main
