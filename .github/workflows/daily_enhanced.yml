name: Daily Contribution Tracker

on:
  schedule:
    # Run daily at midnight UTC (adjust timezone as needed)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering with optional inputs
    inputs:
      message:
        description: 'Custom commit message'
        required: false
        default: 'Daily contribution'

permissions:
  contents: write
  actions: read

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Git configuration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create daily contribution
        run: |
          # Get current date and time
          DATE=$(date '+%Y-%m-%d %H:%M:%S')
          YEAR=$(date '+%Y')
          MONTH=$(date '+%m')
          DAY=$(date '+%d')

          # Create directory structure if it doesn't exist
          mkdir -p contributions/$YEAR/$MONTH
          mkdir -p .github

          # Create or update daily contribution file
          echo "Daily contribution: $DATE" > contributions/$YEAR/$MONTH/$DAY.txt

          # Update activity log
          echo "[$DATE] Automated daily contribution" >> activity.log

          # Create commit graph data file
          cat > latest_contribution.json << EOF
          {
            "date": "$(date -I)",
            "timestamp": "$DATE",
            "type": "daily_contribution",
            "automated": true,
            "workflow_run": "${{ github.run_number }}"
          }
          EOF

          # Update README with latest contribution info
          if [ ! -f README.md ]; then
            cat > README.md << 'EOF'
          # Commit Graph Repository

          This repository maintains daily contributions to keep the GitHub contribution graph active.

          ## Latest Activity
          EOF
          fi

          # Add latest activity to README
          sed -i "/## Latest Activity/a\
          - **$DATE**: Daily automated contribution" README.md

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected and ready to commit"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add .
          COMMIT_MSG="${{ github.event.inputs.message || '📈 Daily contribution' }}: $(date '+%Y-%m-%d')"
          git commit -m "$COMMIT_MSG"
          git push origin main

      - name: Create fallback commit if no changes
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          # Ensure we always have a daily commit
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Keep alive commit" >> .github/daily_activity.log
          git add .github/daily_activity.log
          COMMIT_MSG="${{ github.event.inputs.message || '🔄 Daily activity' }}: $(date '+%Y-%m-%d')"
          git commit -m "$COMMIT_MSG"
          git push origin main

      - name: Workflow summary
        run: |
          echo "## ✅ Daily Contribution Workflow Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully maintained daily contribution activity! 🎉" >> $GITHUB_STEP_SUMMARY
